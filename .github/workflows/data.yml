name: Donnees

# Rythme : GitHub honore les déclenchements programmés « au mieux » et écarte
# largement les cadences très serrées. Avec « */10 » (toutes les 10 minutes),
# trois exécutions seulement ont eu lieu en vingt heures, soit un passage toutes
# les cinq à huit heures — au point que les garde-fous d'âge de la carte
# rejetaient les fichiers pré-calculés et renvoyaient tout le monde en direct
# sur les serveurs d'origine, exactement ce que ce robot doit éviter.
# Un quart d'heure est une cadence que GitHub tient beaucoup plus régulièrement,
# et elle reste sous tous les seuils de fraîcheur du client (1 h pour les
# séismes, le plus exigeant).
# Mesure sur ce depot meme : avec "*/10", trois passages en vingt heures ; avec
# "*/15", AUCUN en sept heures. Le planificateur de GitHub est explicitement
# "best effort" sur les depots publics, et il ecarte massivement les cadences
# serrees exprimees en */n, qui tombent toutes sur les memes minutes rondes que
# celles de milliers d'autres depots.
# MESURE FINALE, apres trois tentatives : « */10 » a donne 3 passages en 20 h,
# « */15 » aucun en 7 h, « 7,22,37,52 » aucun en 11 h. Aucune ecriture du cron
# n'ameliore quoi que ce soit -- le planificateur ecarte simplement la plupart
# des declenchements, et il n'y a aucun recours.
# On cesse donc de compter sur la FREQUENCE des declenchements pour s'appuyer
# sur leur EXISTENCE : chaque declenchement ouvre un service qui collecte toutes
# les quinze minutes pendant 5 h 45 (voir le travail plus bas). Les minutes
# demandees restent nombreuses pour maximiser les chances qu'une seule aboutisse.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      slow:
        description: "Forcer la reconstruction des périmètres brûlés (Copernicus)"
        type: boolean
        default: false
      passage_unique:
        description: "Un seul passage au lieu d'ouvrir le service de 5 h 45"
        type: boolean
        default: false
      duree:
        description: "Durée du service en minutes (vide = 330). Sert à vérifier la relance."
        type: string
        default: ""

permissions:
  contents: write

# Une exécution bloquée ne doit jamais retenir la suivante : on annule celle en
# cours plutôt que d'empiler une file d'attente qui finit par étouffer le
# déclencheur programmé.
concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Le service vise 5 h 30 de collecte, mais la boucle ne sort qu'APRÈS un
    # tour : elle peut donc déborder d'une durée de tour entière. Depuis que la
    # grille de vent respecte la cadence d'Open-Meteo, un tour peut prendre huit
    # minutes. 350 ne laissait qu'une marge de dix-neuf minutes, checkout compris,
    # et un dépassement tue le travail AVANT l'étape de relance : la chaîne
    # s'arrête définitivement. On prend une marge franche, toujours très en
    # dessous de la limite de 6 h.
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4

      # Aucune étape « setup-node » : l'image ubuntu-latest fournit déjà une
      # version de Node récente, largement suffisante pour `fetch` natif.
      - name: Version de Node
        run: node --version

      # ================= SERVICE DE COLLECTE =================
      # POURQUOI UNE BOUCLE PLUTÔT QU'UN PASSAGE.
      # Mesure sur ce dépôt, trois expressions cron successives :
      #     « */10 »          3 passages programmés en 20 h
      #     « */15 »          0 passage en 7 h
      #     « 7,22,37,52 »    0 passage en 11 h
      # Les passages programmés réellement obtenus tombent toutes les cinq à
      # huit heures, quelle que soit la cadence demandée. Le planificateur de
      # GitHub est explicitement « best effort » et écarte massivement les
      # déclenchements sur les dépôts publics ; aucune écriture du cron n'y
      # change quoi que ce soit — c'est vérifié, pas supposé.
      #
      # On cesse donc de compter sur la fréquence des déclenchements et on
      # s'appuie sur leur EXISTENCE : chaque déclenchement, si rare soit-il,
      # ouvre un service qui collecte toutes les quinze minutes jusqu'à
      # l'échéance. Un passage toutes les six heures suffit alors à couvrir la
      # journée entière, là où un passage = une collecte laissait des trous de
      # six heures — au-delà des seuils de fraîcheur de la carte, qui repartait
      # alors interroger les serveurs d'origine par visiteur, exactement ce que
      # ce robot existe pour éviter.
      #
      # `concurrency: cancel-in-progress` fait le reste : le déclenchement
      # suivant annule le service en cours et prend le relais. Il n'y a jamais
      # deux services en vol.
      #
      # POUR REVENIR EN ARRIÈRE : mettre DUREE_MIN à 0 ci-dessous. Le travail
      # redevient un passage unique, comme avant. Sur un dépôt public, les
      # minutes GitHub Actions ne sont pas décomptées.
      - name: Service de collecte
        id: service
        env:
          # Un déclenchement programmé ouvre le service ; un déclenchement
          # manuel ne fait qu'un passage, pour ne pas bloquer un essai.
          # Un declenchement MANUEL ouvre desormais le service lui aussi, sauf si
          # l'on demande expressement un passage unique. Raison mesuree : entre le
          # 29 et le 30 juillet, GitHub n'a delivre que trois declenchements
          # programmes en vingt heures, puis PLUS AUCUN pendant onze heures. Le
          # service ne peut pas s'ouvrir si rien ne le declenche ; autant que
          # chaque geste manuel couvre les six heures suivantes.
          # NE JAMAIS FABRIQUER UN 0 DANS UNE EXPRESSION GITHUB. L'idiome
          # `X && A || B` est cassé dès que A vaut 0 : `true && 0` donne 0, qui
          # est faux, et l'expression bascule sur B. Écrit ainsi,
          # `inputs.passage_unique && 0 || 330` renvoyait 330 quand on demandait
          # un passage unique : la case n'a jamais rien fait. On passe donc les
          # drapeaux bruts et on tranche dans le shell, où 0 reste 0.
          PASSAGE_UNIQUE: ${{ inputs.passage_unique }}
          DUREE_DEMANDEE: ${{ inputs.duree }}
          PAS_SEC: 900
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publier() {
            git add data/
            if git diff --staged --quiet; then
              echo "  rien de neuf, pas de publication."
              return 0
            fi
            git commit -q -m "Donnees $(date -u '+%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              if git push -q; then
                echo "  publié (tentative $i)."
                return 0
              fi
              echo "  tentative $i refusée, resynchronisation…"
              git pull --rebase --autostash -q origin main || true
            done
            echo "::warning::Publication impossible après trois tentatives."
            return 1
          }

          if [ "${PASSAGE_UNIQUE:-false}" = "true" ]; then
            DUREE_MIN=0
          elif [ -n "${DUREE_DEMANDEE:-}" ]; then
            DUREE_MIN="$DUREE_DEMANDEE"
          else
            DUREE_MIN=330
          fi
          echo "Service de $DUREE_MIN min, collecte toutes les $((PAS_SEC/60)) min."

          FIN=$(( $(date +%s) + 60 * DUREE_MIN ))
          TOUR=0
          ECHECS=0
          DUREE_TOUR=0
          while : ; do
            TOUR=$((TOUR+1))
            DEBUT_TOUR=$(date +%s)
            echo "--- tour $TOUR  ($(date -u '+%H:%M:%S') UTC) ---"
            if node scripts/build.js fast && publier; then
              # Le compteur ne repart de zéro que sur un tour RÉUSSI. Je le
              # remettais à zéro à CHAQUE tour (`[ "$ECHECS" -eq 0 ] || ECHECS=0`,
              # qui vaut « mets-le à zéro quoi qu'il arrive ») : le garde-fou des
              # trois échecs consécutifs était donc du code mort, et le service
              # pouvait tourner à vide des heures en donnant l'illusion de
              # fonctionner.
              ECHECS=0
            else
              echo "::warning::Tour $TOUR en échec (collecte ou publication)."
              ECHECS=$((ECHECS+1))
            fi
            if [ "$ECHECS" -ge 3 ]; then
              echo "::error::Trois échecs consécutifs — arrêt du service."
              exit 1
            fi
            DUREE_TOUR=$(( $(date +%s) - DEBUT_TOUR ))
            RESTE=$(( FIN - $(date +%s) ))
            # On sort tant qu'il reste moins que l'attente PLUS un tour complet :
            # sinon la boucle dort, puis lance un tour entier qui deborde
            # l'echeance et peut faire depasser le timeout du travail — ce qui
            # tuerait l'etape de relance et arreterait la chaine pour de bon.
            if [ "$RESTE" -le "$(( PAS_SEC + DUREE_TOUR ))" ]; then
              echo "Échéance atteinte après $TOUR tour(s) (dernier tour : $((DUREE_TOUR/60)) min)."
              break
            fi
            echo "  prochaine collecte dans $((PAS_SEC/60)) min (reste $((RESTE/60)) min)"
            sleep "$PAS_SEC"
            # La branche a pu avancer pendant l'attente (publication manuelle,
            # autre travail) : on se resynchronise avant de recollecter.
            git pull --rebase --autostash -q origin main || true
          done

      - name: Périmètres brûlés (sur demande)
        if: github.event_name == 'workflow_dispatch' && inputs.slow
        run: |
          set -euo pipefail
          node scripts/build.js slow
          git add data/
          git diff --staged --quiet || {
            git commit -q -m "Perimetres brules $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push -q || { git pull --rebase --autostash -q origin main && git push -q; }
          }
      # ================= RELANCE AUTOMATIQUE =================
      # Le planificateur de GitHub ne tient AUCUNE cadence sur ce depot : mesure
      # sur trois expressions cron differentes, puis onze heures sans le moindre
      # declenchement. Le service de 5 h 45 couvre bien la journee, mais encore
      # faut-il qu'il s'ouvre.
      #
      # Un travail ne peut pas se relancer avec le jeton fourni d'office :
      # GitHub refuse deliberement qu'un evenement emis avec GITHUB_TOKEN cree un
      # nouveau travail, pour eviter les boucles infinies. Il faut un jeton
      # personnel, range dans les secrets du depot sous le nom RELANCE.
      #
      # CETTE ETAPE EST INOFFENSIVE TANT QUE LE SECRET N'EXISTE PAS : elle se
      # contente alors de le signaler. Le jour ou il est ajoute, la chaine
      # s'amorce d'elle-meme et le robot devient reellement continu.
      - name: Relancer le service
        # La relance s'applique des que le SERVICE a tourne, quel que soit ce qui
        # l'a declenche. Ma premiere condition excluait les declenchements
        # manuels : la chaine ne pouvait donc s'amorcer que sur un passage
        # programme — precisement ce qui ne vient plus. Seul un passage unique
        # demande expressement ne relance rien.
        #
        # PAS DE RELANCE QUAND LE RUN A ETE ANNULE. Avec `always()`, un service
        # annule par son successeur demandait lui aussi un successeur : A est
        # annule par B, A relance donc C, C annule B, B relance D... une cascade
        # qui se nourrit d'elle-meme et brule le quota d'Actions pour rien. Deux
        # declenchements a quinze secondes d'ecart l'ont montre. Une annulation
        # signifie qu'un successeur EXISTE DEJA : il n'y a rien a relancer.
        # `!cancelled()` conserve en revanche la relance apres un echec, qui est
        # le cas ou elle sert vraiment.
        #
        # ET SEULEMENT SI LE SERVICE A REELLEMENT TOURNE. Si `checkout` echoue,
        # ou si l'image du runner ne fournit pas node, l'etape de collecte est
        # SAUTEE — mais la relance, elle, se declenchait quand meme et demandait
        # un successeur qui echouerait au meme endroit : une boucle rapide qui
        # brule le quota sans jamais collecter la moindre donnee. On exige donc
        # que l'etape de collecte ait un verdict, reussite ou echec, jamais
        # « sautee ».
        if: >-
          ${{ !cancelled() && !inputs.passage_unique
              && (steps.service.outcome == 'success' || steps.service.outcome == 'failure') }}
        env:
          JETON: ${{ secrets.RELANCE }}
        run: |
          if [ -z "${JETON:-}" ]; then
            echo "::notice::Aucun secret RELANCE : le service ne se relancera pas tout seul."
            echo "Pour rendre le robot continu, creer un jeton personnel a portee"
            echo "« actions: write » et l'enregistrer dans les secrets du depot"
            echo "sous le nom RELANCE."
            exit 0
          fi
          # `|| echo 000` : sans lui, un incident reseau (DNS, TLS, coupure) fait
          # sortir curl en erreur, et le shell des etapes tourne sous `bash -e` —
          # l'etape entiere echouerait sur un aleas, au lieu de le signaler.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST             -H "Authorization: Bearer $JETON"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/data.yml/dispatches"             -d '{"ref":"main"}' || echo 000)
          if [ "$code" = "204" ]; then
            echo "Service suivant demande (HTTP $code)."
          else
            echo "::warning::Relance refusee (HTTP $code) — verifier la portee du jeton RELANCE."
          fi

